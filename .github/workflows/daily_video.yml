on:
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * *' # 12:00 منتصف الليل بتوقيت مصر
    - cron: '0 2 * * *'  # 5:00 صباحاً بتوقيت مصر
    - cron: '0 17 * * *' # 8:00 مساءً بتوقيت مصر

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install FFmpeg and Download Arabic Font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg wget
          wget -O Amiri-Bold.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/amiri/Amiri-Bold.ttf"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Main Script
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python main.py

      - name: Upload Generated Videos
        uses: actions/upload-artifact@v4
        with:
          name: daily-videos
          path: final_videos/*.mp4
