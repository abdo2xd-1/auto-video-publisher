name: Video Automation Every 30 Minutes

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start POT Provider Container (Bypass YouTube Bot Check)
        run: |
          docker run -d --name pot-provider -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider:latest
          sleep 5
          curl http://127.0.0.1:4416/ping || true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade requests yt-dlp bgutil-ytdlp-pot-provider google-auth google-api-python-client

      - name: Run main script
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python main.py

      - name: Commit and push history
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add published_history.txt || true
          git commit -m "Update published history [skip ci]" || echo "No history changes"
          git push || true
